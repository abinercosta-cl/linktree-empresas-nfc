  </defs>

  <!-- Background base -->
  <rect width="256" height="256" rx="128" fill="#0A0F1D"/>
  <circle cx="128" cy="128" r="110" fill="url(#bgGlow)"/>
  
  <!-- Outer metallic border ring -->
  <circle cx="128" cy="128" r="124" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stylized Quantum Q / Orbit Icon -->
  <circle cx="128" cy="122" r="54" stroke="url(#qGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Q tail accent -->
  <path d="M152 146L182 176" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>
  <!-- Quantum core spark -->
  <circle cx="128" cy="122" r="10" fill="#E0F2FE"/>
